# Application Properties
spring.application.name = user-service

# Profile Properties
spring.profiles.active = @env@

# Threads Properties
spring.threads.virtual.enabled = true

# Datasource Properties
spring.datasource.url               = jdbc:mysql://127.0.0.1:3306/review_system_db?generateSimpleParameterMetadata=true
spring.datasource.username          = wulf
spring.datasource.password          = wulf123
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# Jackson Properties
spring.jackson.default-property-inclusion = non_null

# Cloud Properties
spring.config.import = optional:configserver:http://127.0.0.1:8085

# Eureka Properties
#eureka.instance.prefer-ip-address     = true
#eureka.client.fetch-registry          = true
#eureka.client.register-with-eureka    = true
#eureka.client.service-url.defaultZone = http://127.0.0.1:8080/eureka

# Server Properties
server.port                 = 8081

# Logger Properties
