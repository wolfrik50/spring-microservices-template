version: '3.8'

services:
  # MySQL Database (for user-service)
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: review_system_db
      MYSQL_USER: wulf
      MYSQL_PASSWORD: wulf123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - microservices-network

  # PostgreSQL Database (for hotel-service)
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: wulf
      POSTGRES_PASSWORD: wulf123
      POSTGRES_DB: review_system_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # MongoDB Database (for rating-service)
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: wulf
      MONGO_INITDB_ROOT_PASSWORD: wulf123
      MONGO_INITDB_DATABASE: reviewSystemDB
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-network

  # Discovery Server (Eureka)
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Config Server
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8085:8085"
    depends_on:
      - mongodb
      - discovery-server
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/review_system_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=wulf
      - SPRING_DATASOURCE_PASSWORD=wulf123
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=com.mysql.cj.jdbc.Driver
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8080/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8085
    networks:
      - microservices-network

  # Hotel Service
  hotel-service:
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    container_name: hotel-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/review_system_db
      - SPRING_DATASOURCE_USERNAME=wulf
      - SPRING_DATASOURCE_PASSWORD=wulf123
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL-AUTO=update
      - SPRING_JPA_SHOW-SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8080/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8085
    networks:
      - microservices-network

  # Rating Service
  rating-service:
    build:
      context: .
      dockerfile: rating-service/Dockerfile
    container_name: rating-service
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://wulf:wulf123@mongodb:27017/reviewSystemDB?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8080/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8085
    networks:
      - microservices-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8084:8084"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8080/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8085
      - SPRING_CLOUD_GATEWAY_DISABLED=false
    networks:
      - microservices-network

# Define the networks
networks:
  microservices-network:
    driver: bridge

# Define the volumes
volumes:
  mysql_data:
  postgres_data:
  mongodb_data:
